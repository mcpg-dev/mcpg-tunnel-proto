[package]
name = "mcpg-tunnel-proto"
version = "0.1.0-beta.14"
license = "Apache-2.0"
edition = "2024"
description = """
Wire protocol for the MCPG reverse tunnel: the framed
HTTP-over-mux data plane, the session handshake, and the yamux session
layer shared by the tunnel agent (`mcpg --tunnel` / `mcpg-tunnel`) and the
`mcpg-cloud-relay` broker. The `session` feature (on by default) adds the
async mux driver; disable it (`default-features = false`) for a pure,
dep-light types-only build.
"""

[lib]
crate-type = ["rlib"]

[features]
default = ["session"]
# The async session/mux layer (yamux over any AsyncRead+AsyncWrite transport)
# plus the tokio-util frame codec. Split from the pure wire types so a
# consumer that only needs the structs can opt out.
session = ["dep:tokio", "dep:tokio-util", "dep:yamux", "dep:futures"]

[dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"], optional = true }
# `codec` = Framed over the FrameCodec; `compat` = bridge yamux's futures-io
# streams to tokio-io (yamux speaks futures-io, tokio-util::codec needs
# tokio-io — the compat shim is required on both the outer transport and
# each accepted stream).
tokio-util = { version = "0.7", features = ["codec", "compat"], optional = true }
yamux = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "rt", "rt-multi-thread", "macros", "time"] }
